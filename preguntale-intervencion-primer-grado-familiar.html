<main><p id="auth-check">Comprobando acceso privado…</p><section id="content" hidden><div class="panel"><span class="step">Paso 1 de 6</span><h2>¿A quién le realizan la intervención quirúrgica?</h2><p class="intro">Selecciona la relación que tienes con la persona intervenida. Así te dirigiremos al permiso correcto.</p><label for="relationship">Familiar o persona afectada</label><select id="relationship"><option value="">Selecciona una opción</option><optgroup label="Familia directa y primer grado"><option value="first">Mi padre</option><option value="first">Mi madre</option><option value="first">Mi hijo</option><option value="first">Mi hija</option><option value="first">Mi suegro</option><option value="first">Mi suegra</option><option value="first">Mi yerno</option><option value="first">Mi nuera</option></optgroup><optgroup label="Cónyuge o pareja"><option value="specific">Mi cónyuge</option><option value="specific">Mi pareja de hecho</option></optgroup><optgroup label="Segundo grado"><option value="second">Mi hermano</option><option value="second">Mi hermana</option><option value="second">Mi abuelo</option><option value="second">Mi abuela</option><option value="second">Mi nieto</option><option value="second">Mi nieta</option><option value="second">Mi cuñado</option><option value="second">Mi cuñada</option></optgroup><optgroup label="Otros casos"><option value="specific">Un familiar de mi pareja de hecho</option><option value="cohabitant">Una persona que convive conmigo</option><option value="review">Otro familiar o relación</option></optgroup></select><button id="continue" class="primary" type="button" disabled>Continuar</button><div id="result" class="result" role="status" aria-live="polite"></div></div></section></main>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const URL='https://icneigdnuntzugisexaz.supabase.co',KEY='sb_publishable_apKjcPClIBTHS2wwN6qPsA_6Vm4tk9m',PAGE='preguntale-intervencion-primer-grado-familiar.html';const supabase=createClient(URL,KEY,{auth:{detectSessionInUrl:false,persistSession:true,autoRefreshToken:true}});async function hasPrivateAccess(session){if(!session)return false;const{data,error}=await supabase.rpc('is_current_user_private_access_allowed');return!error&&data===true}const{data:{session}}=await supabase.auth.getSession();if(!(await hasPrivateAccess(session))){if(session)await supabase.auth.signOut();sessionStorage.setItem('strLabNext',PAGE);window.location.replace(`acceso-privado.html?next=${PAGE}`)}else{document.getElementById('auth-check').hidden=true;document.getElementById('content').hidden=false}const relationship=document.getElementById('relationship'),continueButton=document.getElementById('continue'),result=document.getElementById('result');const savedRelationship=sessionStorage.getItem('strLabInterventionFirstDegreeRelationship');if(savedRelationship){const savedOption=Array.from(relationship.options).find(option=>option.text===savedRelationship);if(savedOption)relationship.selectedIndex=savedOption.index}continueButton.disabled=!relationship.value;relationship.addEventListener('change',()=>{continueButton.disabled=!relationship.value;result.className='result';result.replaceChildren()});function showResult(type,title,message,link){result.className=`result show ${type}`;const heading=document.createElement('strong');heading.textContent=title;const copy=document.createElement('span');copy.textContent=message;result.replaceChildren(heading,copy);if(link){const action=document.createElement('a');action.className='secondary';action.href=link.href;action.textContent=link.label;result.appendChild(action)}}continueButton.addEventListener('click',()=>{if(!relationship.value)return;const selected=relationship.options[relationship.selectedIndex]?.text||'La opción seleccionada';if(relationship.value==='second'){showResult('redirect',`${selected} corresponde al segundo grado`,'Debes continuar en Intervención quirúrgica familiar de segundo grado para responder el cuestionario correcto.',{href:'intervencion-familiar-sin-ingreso-segundo-grado.html',label:'Ir al permiso de segundo grado'});return}if(relationship.value==='cohabitant'){showResult('redirect','Este caso tiene su cuestionario específico','Debes continuar en Intervención de conviviente sin hospitalización.',{href:'intervencion-conviviente-sin-ingreso.html',label:'Ir al permiso de conviviente'});return}if(relationship.value==='review'){showResult('review','Necesitamos comprobar la relación','El cuestionario necesita preguntas adicionales antes de orientarte. No se descarta automáticamente el permiso.');return}if(relationship.value==='first'||relationship.value==='specific'){sessionStorage.setItem('strLabInterventionFirstDegreeRelationship',selected);window.location.href='preguntale-intervencion-primer-grado-fecha.html'}});
