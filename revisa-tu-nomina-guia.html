<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>Revisa tu nómina · STR-IG LAB</title>
  <link rel="icon" type="image/png" href="icono-str-ig.png">
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f5f7;font-family:Arial,Helvetica,sans-serif}.lab-auth{display:grid;place-items:center;width:100%;height:100%;padding:24px;color:#6e6e73;text-align:center;font-size:14px}.frame{display:block;width:100%;height:100%;border:0;background:#f5f5f7}
  </style>
</head>
<body>
  <div id="auth" class="lab-auth">Comprobando acceso privado…</div>
  <iframe id="app-frame" class="frame" title="Revisa tu nómina laboratorio" hidden></iframe>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL='https://icneigdnuntzugisexaz.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY='sb_publishable_apKjcPClIBTHS2wwN6qPsA_6Vm4tk9m';
    const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{detectSessionInUrl:false,persistSession:true,autoRefreshToken:true}});
    const auth=document.getElementById('auth');
    const frame=document.getElementById('app-frame');

    const {data:{session}}=await supabase.auth.getSession();
    let allowed=false;
    if(session){
      const {data,error}=await supabase.rpc('is_current_user_private_access_allowed');
      allowed=!error&&data===true;
    }

    if(!allowed){
      sessionStorage.setItem('strLabNext','revisa-tu-nomina-guia.html');
      window.location.replace('acceso-privado.html?next=revisa-tu-nomina-guia.html');
    }else{
      auth.hidden=true;
      frame.hidden=false;
      frame.src='revisa-tu-nomina.html?labGuide=1';
    }

    function buildGuide(doc){
      if(doc.getElementById('str-timesheet-capture-guide')) return;
      const instruction=doc.querySelector('#document-screen .instruction');
      if(!instruction) return;

      const style=doc.createElement('style');
      style.id='str-guide-style';
      style.textContent=`
        .str-capture-guide{position:relative;overflow:hidden;min-height:355px;margin:0 0 16px;border:2px dashed #9eabb8;border-radius:18px;background:#fbfcfd}
        .str-example-sheet{position:absolute;inset:16px;opacity:.18;filter:grayscale(1);pointer-events:none;color:#111;font-size:9px}
        .str-example-sheet .home{margin-bottom:11px;font-weight:700}
        .str-example-sheet table{width:100%;border-collapse:collapse;margin-bottom:13px}
        .str-example-sheet th,.str-example-sheet td{border:1px solid #111;padding:4px 5px}
        .str-example-sheet th{text-align:center}.str-example-sheet td:last-child{text-align:center;width:30%}
        .str-example-sheet .bar{margin:8px 0 7px;border-top:2px solid #111;padding-top:4px;text-align:center;font-weight:900}
        .str-guide-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;background:rgba(255,255,255,.26)}
        .str-guide-camera{font-size:40px;line-height:1}
        .str-guide-overlay strong{margin-top:9px;color:#b9000b;font-size:18px;line-height:1.25}
        .str-guide-overlay span{max-width:285px;margin-top:7px;color:#343439;font-size:13px;line-height:1.42}
        .str-guide-label{display:block;margin:0 0 8px;color:#18181b;font-size:13px;font-weight:900}
      `;
      doc.head.appendChild(style);

      const guide=doc.createElement('div');
      guide.id='str-timesheet-capture-guide';
      guide.innerHTML=`
        <span class="str-guide-label">Ejemplo de la captura que necesitamos</span>
        <div class="str-capture-guide">
          <div class="str-example-sheet" aria-hidden="true">
            <div class="home">(H) = HOME</div>
            <table><tr><th>TOTAL HORAS PERIODO</th><th>TEÓRICAS</th><th>AUSENCIAS</th></tr><tr><td></td><td>139,6</td><td>90,93</td></tr></table>
            <div class="bar">RESUMEN DE VARIABLES DEL MES</div>
            <table>
              <tr><th>CONCEPTO</th><th>CANTIDAD</th></tr>
              <tr><td>Comidas Can Guasch</td><td>4</td></tr>
              <tr><td>Plus rotatividad</td><td>30</td></tr>
              <tr><td>Plus de turno</td><td>15</td></tr>
              <tr><td>Pluses Vacaciones</td><td>2</td></tr>
              <tr><td>Plus Nocturno</td><td>37</td></tr>
              <tr><td>Plus Festivo</td><td>42,98</td></tr>
              <tr><td>Plus de turno 12 horas</td><td>2</td></tr>
              <tr><td>Dietas Festivos</td><td>2</td></tr>
            </table>
            <div class="bar">SALDOS</div>
            <table>
              <tr><th>CONCEPTO</th><th>CANTIDAD</th></tr>
              <tr><td>Saldo consolidado inicio de mes</td><td>0</td></tr>
              <tr><td>Saldo mensual</td><td>0</td></tr>
              <tr><td>Saldo aprobado manager</td><td>0</td></tr>
              <tr><td>Saldo consolidado final de mes</td><td>0</td></tr>
            </table>
          </div>
          <div class="str-guide-overlay">
            <div class="str-guide-camera">📷</div>
            <strong>Sube esta zona del registro</strong>
            <span>Debe verse claramente «Resumen de variables del mes». No hace falta subir toda la hoja de jornada.</span>
          </div>
        </div>`;
      instruction.insertAdjacentElement('afterend',guide);

      const instructionText=doc.getElementById('instruction-text');
      if(instructionText && doc.getElementById('document-screen-title')?.textContent.trim()==='Registro de jornada'){
        instructionText.textContent='Haz una captura de la zona «Resumen de variables del mes», como en el ejemplo de abajo.';
      }

      const sync=()=>{
        const title=doc.getElementById('document-screen-title')?.textContent.trim()||'';
        const isTimesheet=title==='Registro de jornada';
        guide.hidden=!isTimesheet;
        if(isTimesheet && instructionText){
          instructionText.textContent='Haz una captura de la zona «Resumen de variables del mes», como en el ejemplo de abajo.';
        }
      };
      sync();

      const screen=doc.getElementById('document-screen');
      const title=doc.getElementById('document-screen-title');
      if(screen) new MutationObserver(sync).observe(screen,{attributes:true,attributeFilter:['hidden']});
      if(title) new MutationObserver(sync).observe(title,{childList:true,subtree:true,characterData:true});
    }

    frame.addEventListener('load',()=>{
      try{
        const doc=frame.contentDocument;
        if(!doc) return;
        buildGuide(doc);
        const observer=new MutationObserver(()=>buildGuide(doc));
        observer.observe(doc.documentElement,{childList:true,subtree:true});
      }catch(_error){}
    });
  </script>
</body>
</html>
