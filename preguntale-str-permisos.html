<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#e30613">
  <title>Permisos retribuidos · Pregúntale a STR-IG LAB</title>
  <link rel="icon" type="image/png" href="icono-str-ig.png">
  <link rel="apple-touch-icon" href="icono-str-ig.png">
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --red: #e30613;
      --red-soft: #fff0f1;
      --black: #161616;
      --grey: #6e6e73;
      --light: #f5f5f7;
      --white: #fff;
    }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--light);
      color: var(--black);
      padding-bottom: calc(92px + env(safe-area-inset-bottom));
    }
    .top {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(245,245,247,.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #e4e4e7;
      padding: calc(14px + env(safe-area-inset-top)) 18px 14px;
    }
    .top-inner {
      max-width: 900px;
      margin: auto;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .back {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      border-radius: 50%;
      background: var(--white);
      display: grid;
      place-items: center;
      text-decoration: none;
      color: var(--red);
      font-size: 26px;
      font-weight: 700;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }
    h1 { font-size: 27px; line-height: 1.05; }
    main { max-width: 900px; margin: auto; padding: 22px 18px 34px; }
    .intro { color: var(--grey); font-size: 15px; line-height: 1.45; margin-bottom: 20px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 14px;
      align-items: stretch;
    }
    .image-card,
    .permit-card {
      background: var(--white);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 5px 18px rgba(0,0,0,.07);
      text-decoration: none;
      color: inherit;
      width: 100%;
      aspect-ratio: 1.5 / 1;
      min-height: 0;
    }
    .image-card img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }
    .permit-card {
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .icon {
      width: 44px;
      height: 44px;
      border-radius: 13px;
      background: var(--red);
      display: grid;
      place-items: center;
      font-size: 21px;
    }
    .permit-card h2 { font-size: clamp(15px, 4vw, 19px); line-height: 1.08; }
    .tag {
      align-self: flex-start;
      background: var(--red-soft);
      color: #b9000b;
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 700;
    }
    #auth-check { color: var(--grey); text-align: center; }
    .bottom-nav {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 0;
      width: 100%;
      max-width: 1100px;
      min-height: 76px;
      padding-bottom: env(safe-area-inset-bottom);
      background: rgba(255,255,255,.97);
      backdrop-filter: blur(12px);
      border-top: 1px solid #e5e5e5;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 50;
    }
    .bottom-nav a {
      text-decoration: none;
      color: #666;
      text-align: center;
      font-size: 11px;
      min-width: 58px;
    }
    .bottom-nav a b { display: block; font-size: 21px; margin-bottom: 4px; }
    .bottom-nav a.active { color: var(--red); font-weight: 800; }
    @media (min-width: 700px) {
      .grid { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="back" href="preguntale-str-ig.html" aria-label="Volver a Pregúntale a STR-IG">‹</a>
      <h1>Permisos retribuidos</h1>
    </div>
  </header>

  <main>
    <p id="auth-check">Comprobando acceso privado…</p>
    <section id="content" hidden>
      <p class="intro">Selecciona el permiso que quieres consultar.</p>

      <div class="grid">
        <a class="image-card" href="hospitalizacion-primer-grado.html">
          <img src="boton-hospitalizacion-primer-grado.png" alt="Hospitalización familiar primer grado">
        </a>
        <a class="image-card" href="hospitalizacion-segundo-grado.html">
          <img src="card-hospitalizacion-familiar-segundo-grado.png" alt="Hospitalización familiar segundo grado">
        </a>
        <a class="image-card" href="intervencion-familiar-sin-ingreso-primer-grado.html">
          <img src="intervencion-familiar-sin-ingreso-primer-grado.png" alt="Intervención familiar sin ingreso primer grado">
        </a>
        <a class="image-card" href="intervencion-familiar-sin-ingreso-segundo-grado.html">
          <img src="intervencion-familiar-sin-ingreso-segundo-grado.png" alt="Intervención familiar sin ingreso segundo grado">
        </a>
        <a class="image-card" href="intervencion-conviviente-sin-ingreso.html">
          <img src="card-intervencion-conviviente-sin-ingreso.png" alt="Intervención de conviviente sin ingreso">
        </a>
        <a class="image-card" href="fallecimiento-familiar.html">
          <img src="card-fallecimiento-familiar.png" alt="Fallecimiento familiar">
        </a>
        <a class="image-card" href="matrimonio.html">
          <img src="permiso-matrimonio.png" alt="Permiso por matrimonio">
        </a>
        <a class="image-card" href="fuerza-mayor-familiar.html">
          <img src="ficha-fuerza-mayor-familiar.png" alt="Fuerza mayor familiar">
        </a>
        <div class="permit-card">
          <div class="icon">🩺</div>
          <h2>Intervención quirúrgica</h2>
          <span class="tag">Ver permiso</span>
        </div>
        <div class="permit-card">
          <div class="icon">📄</div>
          <h2>Deber inexcusable</h2>
          <span class="tag">Ver permiso</span>
        </div>
      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <a class="active" href="index.html"><b>⌂</b>Inicio</a>
    <a href="index.html"><b>⚖</b>Derechos</a>
    <a href="index.html"><b>📰</b>Actualidad</a>
    <a href="index.html"><b>👥</b>Sindicato</a>
    <a href="index.html"><b>♡</b>Afíliate</a>
    <a href="index.html"><b>☎</b>Contacto</a>
  </nav>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const URL = 'https://icneigdnuntzugisexaz.supabase.co';
    const KEY = 'sb_publishable_apKjcPClIBTHS2wwN6qPsA_6Vm4tk9m';
    const supabase = createClient(URL, KEY, {
      auth: { detectSessionInUrl: false, persistSession: true, autoRefreshToken: true }
    });

    async function hasPrivateAccess(session) {
      if (!session) return false;
      const { data, error } = await supabase.rpc('is_current_user_private_access_allowed');
      return !error && data === true;
    }

    const { data: { session } } = await supabase.auth.getSession();
    if (!(await hasPrivateAccess(session))) {
      if (session) await supabase.auth.signOut();
      sessionStorage.setItem('strLabNext', 'preguntale-str-permisos.html');
      window.location.replace('acceso-privado.html?next=preguntale-str-permisos.html');
    } else {
      document.getElementById('auth-check').hidden = true;
      document.getElementById('content').hidden = false;
    }
  </script>
</body>
</html>
