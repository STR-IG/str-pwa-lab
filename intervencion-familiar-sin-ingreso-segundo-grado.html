<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#e30613">
  <title>Intervención familiar sin ingreso 2º grado · STR-IG</title>
  <link rel="icon" type="image/png" href="icono-str-ig.png">
  <link rel="apple-touch-icon" href="icono-str-ig.png">
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --red:#e30613; --light:#f5f5f7; --white:#fff; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--light);
      color: #161616;
      min-height: 100vh;
      padding: calc(14px + env(safe-area-inset-top)) 18px calc(26px + env(safe-area-inset-bottom));
    }
    .page { max-width: 900px; margin: 0 auto; }
    .sheet {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 20px;
      box-shadow: 0 5px 18px rgba(0,0,0,.07);
    }
    .back-bottom {
      display: block;
      width: 100%;
      text-align: center;
      text-decoration: none;
      color: var(--white);
      background: var(--red);
      font-weight: 800;
      border-radius: 999px;
      padding: 15px 18px;
      margin-top: 18px;
    }
  </style>
</head>
<body>
  <main class="page">
    <img
      class="sheet"
      src="`ficha-intervencion-familiar-sin-ingreso-segundo-grado`.png"
      alt="Ficha Intervención familiar sin ingreso 2º grado"
    >

    <a class="back-bottom" href="permisos.html">Volver a Permisos retribuidos</a>
  </main>
</body>
</html>
