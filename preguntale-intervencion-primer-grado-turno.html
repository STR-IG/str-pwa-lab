<!DOCTYPE html>

  <style>
    *{box-sizing:border-box;margin:0;padding:0}:root{--red:#e30613;--red-dark:#b9000b;--green:#0b6b4f;--green-soft:#edf8f3;--black:#161616;--grey:#6e6e73;--line:#dddddf;--light:#f5f5f7;--white:#fff}body{min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:var(--light);color:var(--black)}.top{position:sticky;top:0;z-index:20;padding:calc(14px + env(safe-area-inset-top)) 18px 14px;border-bottom:1px solid #e4e4e7;background:rgba(245,245,247,.96);backdrop-filter:blur(12px)}.top-inner{display:flex;align-items:center;gap:14px;max-width:680px;margin:auto}.back{display:grid;place-items:center;flex:0 0 42px;width:42px;height:42px;border-radius:50%;color:var(--red);background:var(--white);box-shadow:0 3px 12px rgba(0,0,0,.08);text-decoration:none;font-size:26px;font-weight:700}h1{font-size:clamp(21px,5vw,27px);line-height:1.08}main{max-width:680px;margin:auto;padding:24px 18px 48px}.panel{padding:22px;border-radius:22px;background:var(--white);box-shadow:0 6px 22px rgba(0,0,0,.07)}.step{display:inline-block;margin-bottom:10px;color:var(--red-dark);font-size:12px;font-weight:900;letter-spacing:.5px;text-transform:uppercase}h2{margin-bottom:8px;font-size:24px;line-height:1.15}.intro{margin-bottom:18px;color:var(--grey);font-size:15px;line-height:1.5}.selection{margin-bottom:18px;padding:12px 14px;border-radius:14px;color:var(--green);background:var(--green-soft);font-size:14px;font-weight:800}.fields{display:grid;gap:16px}label{display:block;margin-bottom:8px;font-size:14px;font-weight:800}input,select{width:100%;min-height:56px;padding:0 15px;border:1px solid var(--line);border-radius:15px;color:var(--black);background:var(--white);font:inherit;font-size:16px}input:focus,select:focus{border-color:var(--red);outline:3px solid rgba(227,6,19,.10)}.primary{width:100%;min-height:52px;margin-top:18px;border:0;border-radius:999px;color:var(--white);background:var(--red);font:inherit;font-weight:800;cursor:pointer}.primary:disabled{opacity:.45;cursor:not-allowed}#auth-check{color:var(--grey);text-align:center}@media(max-width:440px){main{padding:18px 14px 38px}.panel{padding:19px 16px}}
  </style>
</head>
<body>
  <header class="top"><div class="top-inner"><a class="back" href="preguntale-intervencion-primer-grado-jornada.html" aria-label="Volver al primer día del permiso">‹</a><h1>Intervención quirúrgica familiar</h1></div></header>
  <main><p id="auth-check">Comprobando acceso privado…</p><section id="content" hidden><div class="panel"><span class="step">Paso 5 de 6</span><h2>El día de la intervención, ¿qué turno tenías?</h2><p class="intro">Indica la hora prevista de la intervención y el turno que tenías asignado ese día. Es especialmente importante cuando trabajas de noche.</p><p id="date-summary" class="selection" hidden></p><div class="fields"><div><label for="intervention-time">Hora de la intervención</label><input id="intervention-time" type="time"></div><div><label for="work-shift">Turno que tenías asignado</label><select id="work-shift"><option value="">Selecciona tu turno</option><option value="morning">Turno de mañana</option><option value="afternoon">Turno de tarde</option><option value="night-start">Turno de noche que empezaba ese día</option><option value="night-previous">Turno de noche iniciado el día anterior</option><option value="rest">Ese día libraba</option></select></div></div><button id="continue" class="primary" type="button" disabled>Continuar</button></div></section></main>
  <script type="module">
    import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const URL='https://icneigdnuntzugisexaz.supabase.co',KEY='sb_publishable_apKjcPClIBTHS2wwN6qPsA_6Vm4tk9m',PAGE='preguntale-intervencion-primer-grado-turno.html';const supabase=createClient(URL,KEY,{auth:{detectSessionInUrl:false,persistSession:true,autoRefreshToken:true}});async function hasPrivateAccess(session){if(!session)return false;const{data,error}=await supabase.rpc('is_current_user_private_access_allowed');return!error&&data===true}const{data:{session}}=await supabase.auth.getSession();if(!(await hasPrivateAccess(session))){if(session)await supabase.auth.signOut();sessionStorage.setItem('strLabNext',PAGE);window.location.replace(`acceso-privado.html?next=${PAGE}`)}else{document.getElementById('auth-check').hidden=true;document.getElementById('content').hidden=false}const interventionDate=sessionStorage.getItem('strLabInterventionFirstDegreeDate')||'',summary=document.getElementById('date-summary'),interventionTime=document.getElementById('intervention-time'),workShift=document.getElementById('work-shift'),continueButton=document.getElementById('continue');if(interventionDate){const date=new Date(`${interventionDate}T12:00:00`);summary.textContent=`Fecha de la intervención: ${new Intl.DateTimeFormat('es-ES',{day:'numeric',month:'long',year:'numeric'}).format(date)}`;summary.hidden=false}interventionTime.value=sessionStorage.getItem('strLabInterventionFirstDegreeTime')||'';workShift.value=sessionStorage.getItem('strLabInterventionFirstDegreeWorkShift')||'';function update(){continueButton.disabled=!(interventionTime.value&&workShift.value)}interventionTime.addEventListener('input',update);workShift.addEventListener('change',update);update();continueButton.addEventListener('click',()=>{if(continueButton.disabled)return;sessionStorage.setItem('strLabInterventionFirstDegreeTime',interventionTime.value);sessionStorage.setItem('strLabInterventionFirstDegreeWorkShift',workShift.value);window.location.href='preguntale-intervencion-primer-grado-dias.html'});
  </script>
